      // ambil referensi elemen
      const kategori = document.getElementById('kategoriSelect');
      const tipeSelect = document.getElementById('tipeSelect');
      const itemSelect = document.getElementById('itemSelect');
      const waBtn = document.getElementById('waButton');

      // display field
      const dKategori = document.getElementById('displayKategori');
      const dTipe = document.getElementById('displayTipe');
      const dItem = document.getElementById('displayItem');
      const dJenis = document.getElementById('displayJenis');
      const dHarga = document.getElementById('displayHarga');
      const dEstimasi = document.getElementById('displayEstimasi');

      // state saat ini
      let currentKategori = 'Android';
      let currentTipe = 'Layar';
      let currentItemObj = null;

      // utilitas format rupiah
      function formatRupiah(angka) {
        return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      }

      // update tipe berdasarkan kategori
      function populateTipe(selectedKategori) {
        const filtered = serviceDB.filter(s => s.kategori === selectedKategori);
        const tipeSet = new Set(filtered.map(s => s.tipe));
        const tipeList = Array.from(tipeSet).sort();

        tipeSelect.innerHTML = '';
        tipeList.forEach(tipe => {
          const option = document.createElement('option');
          option.value = tipe;
          option.textContent = tipe;
          tipeSelect.appendChild(option);
        });

        // jika tipe sebelumnya tidak ada di list, pilih yang pertama
        if (!tipeList.includes(currentTipe) || currentKategori !== selectedKategori) {
          currentTipe = tipeList[0] || '';
          tipeSelect.value = currentTipe;
        } else {
          tipeSelect.value = currentTipe;
        }

        populateItem(selectedKategori, currentTipe);
      }

      // populate item berdasarkan kategori & tipe
      function populateItem(kat, tip) {
        const filtered = serviceDB.filter(s => s.kategori === kat && s.tipe === tip);
        // sorting berdasarkan nama biar konsisten
        filtered.sort((a,b) => a.nama.localeCompare(b.nama));

        itemSelect.innerHTML = '';
        filtered.forEach((item, index) => {
          const option = document.createElement('option');
          option.value = index; // pakai index sementara, data disimpan di valueObjek
          option.textContent = item.nama;
          // simpan data di dataset option? lebih mudah pakai array reference
          option.dataset.harga = item.harga;
          option.dataset.jenis = item.jenis;
          option.dataset.estimasi = item.estimasi;
          option.dataset.nama = item.nama;
          option.dataset.tipe = item.tipe;
          option.dataset.kategori = item.kategori;
          itemSelect.appendChild(option);
        });

        if (filtered.length > 0) {
          // pilih item pertama
          itemSelect.selectedIndex = 0;
          currentItemObj = filtered[0];
        } else {
          currentItemObj = null;
        }

        // update tampilan detail
        updateDetailFromCurrent();
      }

      // perbarui tampilan card detail dan simpan currentItemObj
      function updateDetailFromCurrent() {
        if (!currentItemObj) {
          // fallback jika tidak ada item
          dKategori.textContent = currentKategori;
          dTipe.textContent = currentTipe;
          dItem.textContent = '-';
          dJenis.textContent = '-';
          dHarga.textContent = '-';
          dEstimasi.textContent = '-';
          return;
        }

        dKategori.textContent = currentItemObj.kategori;
        dTipe.textContent = currentItemObj.tipe;
        dItem.textContent = currentItemObj.nama;
        dJenis.textContent = currentItemObj.jenis;
        dHarga.textContent = formatRupiah(currentItemObj.harga);
        dEstimasi.textContent = currentItemObj.estimasi;
      }

      // event ketika kategori berubah
      kategori.addEventListener('change', function() {
        currentKategori = this.value;
        populateTipe(currentKategori);
      });

      // event ketika tipe berubah
      tipeSelect.addEventListener('change', function() {
        currentTipe = this.value;
        populateItem(currentKategori, currentTipe);
      });

      // event ketika item berubah
      itemSelect.addEventListener('change', function() {
        const selectedIndex = this.value;
        const kat = currentKategori;
        const tip = currentTipe;
        const filtered = serviceDB.filter(s => s.kategori === kat && s.tipe === tip);
        if (filtered.length > 0 && selectedIndex < filtered.length) {
          currentItemObj = filtered[selectedIndex];
        } else {
          currentItemObj = filtered[0] || null;
        }
        updateDetailFromCurrent();
      });

      // inisialisasi awal
      currentKategori = 'Android';
      currentTipe = 'Layar';
      kategori.value = 'Android';
      populateTipe('Android'); // sekalian populate item

      // tombol WA
      waBtn.addEventListener('click', function() {
        if (!currentItemObj) {
          alert('Pilih layanan terlebih dahulu.');
          return;
        }

        const noTujuan = '085713087659'; // tanpa +62 atau 08, kita format
        // format nomor: 08xxx → 628xxx (hilangkan 0 depan, ganti 62)
        let formattedPhone = noTujuan.trim();
        if (formattedPhone.startsWith('0')) {
          formattedPhone = '62' + formattedPhone.substring(1);
        } else if (!formattedPhone.startsWith('62')) {
          formattedPhone = '62' + formattedPhone; // asumsi nomor diawali 8, jarang
        }
        // buang spasi/tanda hubung
        formattedPhone = formattedPhone.replace(/[^0-9]/g, '');

        const item = currentItemObj;
        const pesan = `Halo, saya ingin servis dengan detail:%0A%0A📌 *Kategori*: ${item.kategori}%0A⚠️ *Tipe*: ${item.tipe}%0A🔩 *Item*: ${item.nama}%0A💳 *Jenis*: ${item.jenis}%0A💰 *Harga*: ${formatRupiah(item.harga)}%0A⏱️ *Estimasi*: ${item.estimasi}%0A%0AApakah tersedia? Mohon infonya.`;

        const waUrl = `https://wa.me/${formattedPhone}?text=${pesan}`;
        window.open(waUrl, '_blank');
      });

      if ('serviceWorker' in navigator) {

    })();
